<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Manage the fitz demo catalog."><title>fitz · seller studio</title><link rel="stylesheet" href="/styles.css"></head>
<body>
  <header class="topbar"><a class="wordmark" href="/">fitz<span>.</span></a><nav><a href="/">Shop</a><a class="active" href="/seller.html">Seller panel</a><a id="account-link" href="/account.html" hidden></a><button id="logout-btn" class="nav-button" type="button">Log out</button></nav></header>
  <main class="page seller-page">
    <section class="hero"><div><h1>Manage products</h1><p>Add products and choose what shoppers can see.</p></div><a class="preview-link" href="/">View shop</a></section>
    <section class="panel create-panel" hidden><div><span class="eyebrow">ADD A PRODUCT</span><h2>New product</h2></div><form id="create-form" class="create-form"><label>Name <input name="item_name" required maxlength="160" placeholder="Product name"></label><label>Price ($) <input name="price" type="number" min="0.01" max="100000" step="0.01" required></label><label>Picture <input name="picture" type="file" accept="image/png,image/jpeg,image/webp" required></label><label>Category <input name="category" placeholder="Top"></label><label>Store product URL <input name="store_url" type="url" placeholder="https://..."></label><fieldset><legend>Stock by size</legend><label>S <input name="S" type="number" min="0" step="1" value="1" required></label><label>M <input name="M" type="number" min="0" step="1" value="1" required></label><label>L <input name="L" type="number" min="0" step="1" value="1" required></label></fieldset><label class="check-label"><input name="visible" type="checkbox"> Publish now</label><button class="primary-button" type="submit">Save product</button><p id="create-status" role="status"></p></form></section>
    <section class="seller-shell panel"><div class="seller-top"><div><h2>Inventory <span id="seller-count">0 saved</span></h2></div><button id="import-btn" hidden class="primary-button" type="button">Import Grailed items</button></div>
      <p id="seller-status" class="status seller-status" role="status">Loading saved pieces…</p>
      <div class="seller-layout">
        <aside class="inventory-pane"><label class="search-label" for="seller-filter">SEARCH INVENTORY</label><input id="seller-filter" type="search" placeholder="Search by item or ID"><div id="seller-items" class="inventory-list"></div></aside>
        <section id="seller-editor" class="editor-pane" aria-label="Selected item details"><div class="editor-empty"><span class="eyebrow">SELECT A PIECE</span><h3>Choose an item to edit.</h3><p>Your product details and gallery will appear here.</p></div></section>
      </div>
    </section>
  </main><script src="/nav.js" defer></script><script src="/seller.js" defer></script>
</body>
</html>
